<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaTalk</title>
  
<style>
  :root {
    --bg: #0f0f13; --bg2: #17171e; --bg3: #1e1e28; --bg4: #252533;
    --accent: #7c6fcd; --accent2: #9d93e0; --accent-dim: rgba(124,111,205,0.15);
    --text: #e8e6f0; --text2: #9b99aa; --text3: #5c5a6a;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --green: #3ecf8e; --red: #f44; --r: 10px; --r2: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  /* AUTH */
  #auth-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .auth-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--r2);
    padding: 2.5rem; width: 360px; box-shadow: 0 32px 80px rgba(0,0,0,0.5); }
  .auth-logo { font-size: 1.6rem; font-weight: 700; color: var(--accent2); margin-bottom: 0.3rem; }
  .auth-sub { color: var(--text2); font-size: 0.85rem; margin-bottom: 1.5rem; }
  .auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .auth-tab { flex: 1; padding: 0.6rem; text-align: center; cursor: pointer; color: var(--text2);
    font-size: 0.9rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .auth-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 0.78rem; color: var(--text2); margin-bottom: 0.4rem;
    text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--r); padding: 0.7rem 1rem; color: var(--text); font-size: 0.9rem; outline: none; font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
  .btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--r);
    padding: 0.8rem; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
  .btn-primary:hover { background: var(--accent2); }
  .auth-error { color: var(--red); font-size: 0.82rem; margin-top: 0.5rem; text-align: center; min-height: 1.2em; }
  .avatar-pick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.5rem; }
  .avatar-pick span { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 1.1rem; cursor: pointer; border: 2px solid transparent; background: var(--bg3); }
  .avatar-pick span.selected { border-color: var(--accent2); }

  /* APP */
  #app { display: none; height: 100vh; }
  #app.visible { display: flex; }
  .sidebar { width: 260px; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 1rem; display: flex; align-items: center; gap: 0.7rem; border-bottom: 1px solid var(--border); cursor: pointer; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
  .sidebar-header-info { flex: 1; min-width: 0; }
  .sidebar-name { font-weight: 600; font-size: 0.92rem; }
  .sidebar-status { font-size: 0.75rem; color: var(--green); }
  .sidebar-sec { padding: 1rem 1rem 0.4rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text3); display: flex; justify-content: space-between; align-items: center; }
  .sidebar-sec button { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 1.1rem; }
  .sidebar-sec button:hover { color: var(--accent2); }
  .room-list { overflow-y: auto; flex: 1; }
  .room-item { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 1rem; cursor: pointer; }
  .room-item:hover { background: var(--bg3); }
  .room-item.active { background: var(--accent-dim); }
  .room-item.active .room-name { color: var(--accent2); }
  .room-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--bg4); display: flex;
    align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
  .room-name { font-size: 0.88rem; font-weight: 500; }
  .sidebar-footer { padding: 0.8rem; border-top: 1px solid var(--border); }
  .btn-secondary { background: none; border: 1px solid var(--border2); color: var(--text); border-radius: 8px;
    padding: 0.5rem 1rem; cursor: pointer; font-size: 0.82rem; width: 100%; }
  .btn-secondary:hover { background: var(--bg3); }

  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header { display: flex; align-items: center; padding: 0 1.2rem; height: 54px; background: var(--bg2);
    border-bottom: 1px solid var(--border); gap: 0.75rem; flex-shrink: 0; }
  .chat-header-name { font-weight: 600; font-size: 0.95rem; }
  .messages { flex: 1; overflow-y: auto; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .msg-group { display: flex; gap: 0.6rem; max-width: 75%; }
  .msg-group.own { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0; align-self: flex-end; }
  .msg-content { display: flex; flex-direction: column; gap: 2px; }
  .msg-group.own .msg-content { align-items: flex-end; }
  .msg-sender { font-size: 0.72rem; color: var(--text2); padding: 0 0.4rem; }
  .msg-bubble { background: var(--bg3); border-radius: 14px 14px 14px 4px; padding: 0.55rem 0.8rem; font-size: 0.88rem; line-height: 1.45; word-break: break-word; }
  .msg-group.own .msg-bubble { background: var(--accent); border-radius: 14px 14px 4px 14px; }
  .msg-time { font-size: 0.65rem; color: var(--text3); padding: 0 0.4rem; }
  .chat-input-area { padding: 0.8rem 1.2rem; background: var(--bg2); border-top: 1px solid var(--border);
    display: flex; gap: 0.7rem; flex-shrink: 0; }
  #msg-input { flex: 1; background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px;
    padding: 0.7rem 1rem; color: var(--text); font-size: 0.9rem; outline: none; resize: none; max-height: 100px; font-family: inherit; }
  #msg-input:focus { border-color: var(--accent); }
  .send-btn { width: 42px; height: 42px; background: var(--accent); border: none; border-radius: 10px;
    cursor: pointer; font-size: 1.1rem; color: #fff; flex-shrink: 0; }
  .send-btn:hover { background: var(--accent2); }
  .welcome-area { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text2); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
    display: flex; align-items: center; justify-content: center; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--r2); padding: 2rem; width: 380px; }
  .modal h3 { margin-bottom: 1.2rem; font-size: 1.05rem; }
  .modal-actions { display: flex; gap: 0.6rem; margin-top: 1.2rem; justify-content: flex-end; }
  .toast { position: fixed; bottom: 1.2rem; right: 1.2rem; background: var(--bg4); border: 1px solid var(--border2);
    border-radius: var(--r); padding: 0.7rem 1rem; font-size: 0.85rem; z-index: 400; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">NovaTalk Lite</div>
    <div class="auth-sub">แชทแบบเรียลไทม์ — เชื่อมต่อกับ Firebase</div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login', this)">เข้าสู่ระบบ</div>
      <div class="auth-tab" onclick="switchTab('register', this)">สมัครสมาชิก</div>
    </div>
    <div id="login-form">
      <div class="form-group"><label>Username</label><input id="login-user" type="text"></div>
      <div class="form-group"><label>Password</label><input id="login-pass" type="password"></div>
      <button class="btn-primary" onclick="doLogin()">เข้าสู่ระบบ</button>
      <div class="auth-error" id="login-err"></div>
    </div>
    <div id="register-form" style="display:none">
      <div class="form-group"><label>ชื่อที่แสดง</label><input id="reg-name" type="text"></div>
      <div class="form-group"><label>Username</label><input id="reg-user" type="text"></div>
      <div class="form-group"><label>Password</label><input id="reg-pass" type="password"></div>
      <div class="form-group">
        <label>Avatar</label>
        <div class="avatar-pick" id="avatar-pick">
          <span class="selected" onclick="pickAv(this,'🐱')">🐱</span>
          <span onclick="pickAv(this,'🦋')">🦋</span>
          <span onclick="pickAv(this,'🐶')">🐶</span>
          <span onclick="pickAv(this,'🐼')">🐼</span>
          <span onclick="pickAv(this,'🦊')">🦊</span>
          <span onclick="pickAv(this,'🐨')">🐨</span>
        </div>
      </div>
      <button class="btn-primary" onclick="doRegister()">สมัครสมาชิก</button>
      <div class="auth-error" id="register-err"></div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="sidebar">
    <div class="sidebar-header" onclick="openProfile()">
      <div class="avatar" id="sidebar-av"></div>
      <div class="sidebar-header-info">
        <div class="sidebar-name" id="sidebar-name"></div>
        <div class="sidebar-status">ออนไลน์</div>
      </div>
    </div>
    <div class="sidebar-sec">
      <span>ห้องแชท</span>
      <button onclick="openCreateRoom()" title="สร้างห้องใหม่">＋</button>
    </div>
    <div class="room-list" id="room-list"></div>
    <div class="sidebar-footer">
      <button class="btn-secondary" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>
  <div class="chat-area" id="chat-area">
    <div class="welcome-area">เลือกห้องแชทเพื่อเริ่มคุย 💬</div>
  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal-overlay hidden" id="profile-modal">
  <div class="modal">
    <h3>โปรไฟล์ของฉัน</h3>
    <div class="form-group" style="text-align:center">
      <div class="avatar" id="profile-av-big" style="width:64px;height:64px;font-size:2rem;margin:0 auto 1rem;"></div>
    </div>
    <div class="avatar-pick" id="profile-avatar-pick" style="justify-content:center;margin-bottom:1rem;">
      <span onclick="pickProfileAv(this,'🐱')">🐱</span>
      <span onclick="pickProfileAv(this,'🦋')">🦋</span>
      <span onclick="pickProfileAv(this,'🐶')">🐶</span>
      <span onclick="pickProfileAv(this,'🐼')">🐼</span>
      <span onclick="pickProfileAv(this,'🦊')">🦊</span>
      <span onclick="pickProfileAv(this,'🐨')">🐨</span>
    </div>
    <div class="form-group"><label>ชื่อที่แสดง</label><input id="edit-display-name" type="text"></div>
    <div class="form-group"><label>เกี่ยวกับฉัน</label><textarea id="edit-bio" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('profile-modal')">ปิด</button>
      <button class="btn-primary" style="width:auto;margin-top:0" onclick="saveProfile()">บันทึก</button>
    </div>
  </div>
</div>

<!-- CREATE ROOM MODAL -->
<div class="modal-overlay hidden" id="create-room-modal">
  <div class="modal">
    <h3>สร้างห้องแชทใหม่</h3>
    <div class="form-group"><label>ชื่อห้อง</label><input id="new-room-name" type="text"></div>
    <div class="form-group"><label>ไอคอน (emoji)</label><input id="new-room-icon" type="text" value="💬" maxlength="2"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('create-room-modal')">ยกเลิก</button>
      <button class="btn-primary" style="width:auto;margin-top:0" onclick="createRoom()">สร้าง</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="db-firebase.js"></script>

<script>
// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let currentUser = null;
let activeRoomId = null;
let selectedAvatar = '🐱';

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
async function initApp() {
  await DB.loadAll(['users', 'rooms']);
  if (!DB.get('users')) DB.set('users', {});
  if (!DB.get('rooms')) {
    DB.set('rooms', {
      r1: { name: 'ทั่วไป', icon: '💬', createdAt: Date.now() }
    });
  }
  // ฟัง realtime ของ users / rooms ตลอดเวลา
  DB.watch('users', () => { if (currentUser) updateSidebarUser(); });
  DB.watch('rooms', () => { renderRoomList(); });

  const sid = sessionStorage.getItem('nt_session');
  if (sid) {
    const users = DB.get('users') || {};
    if (users[sid]) { currentUser = { id: sid, ...users[sid] }; launchApp(); }
  }
}
initApp();

// ════════════════════════════════════════
// AUTH
// ════════════════════════════════════════
function switchTab(tab, el) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
}

function pickAv(el, emoji) {
  document.querySelectorAll('#avatar-pick span').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  selectedAvatar = emoji;
}

function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = 'กรุณากรอกข้อมูลให้ครบ'; return; }
  const users = DB.get('users') || {};
  const entry = Object.entries(users).find(([id, u]) => u.username === username && u.password === password);
  if (!entry) { errEl.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'; return; }
  currentUser = { id: entry[0], ...entry[1] };
  sessionStorage.setItem('nt_session', currentUser.id);
  launchApp();
}

function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const username = document.getElementById('reg-user').value.trim().toLowerCase().replace(/\s/g, '');
  const password = document.getElementById('reg-pass').value;
  const errEl = document.getElementById('register-err');
  errEl.textContent = '';
  if (!name || !username || !password) { errEl.textContent = 'กรุณากรอกข้อมูลให้ครบ'; return; }
  const users = DB.get('users') || {};
  if (Object.values(users).some(u => u.username === username)) {
    errEl.textContent = 'ชื่อผู้ใช้นี้มีคนใช้แล้ว'; return;
  }
  const id = 'u' + Date.now();
  users[id] = {
    username, password, displayName: name, avatar: selectedAvatar,
    bio: '', color: '#2a1a3e', createdAt: Date.now()
  };
  DB.set('users', users);
  currentUser = { id, ...users[id] };
  sessionStorage.setItem('nt_session', currentUser.id);
  launchApp();
}

function doLogout() {
  Object.keys(DB.cache).forEach(k => { if (k.startsWith('messages/')) DB.unwatch(k); });
  sessionStorage.removeItem('nt_session');
  currentUser = null;
  activeRoomId = null;
  document.getElementById('app').classList.remove('visible');
  document.getElementById('auth-screen').style.display = 'flex';
}

function launchApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  updateSidebarUser();
  renderRoomList();
  showToast(`ยินดีต้อนรับ ${currentUser.displayName}!`);
}

// ════════════════════════════════════════
// PROFILE
// ════════════════════════════════════════
function updateSidebarUser() {
  const users = DB.get('users') || {};
  const fresh = users[currentUser.id];
  if (fresh) currentUser = { id: currentUser.id, ...fresh };
  const av = document.getElementById('sidebar-av');
  av.textContent = currentUser.avatar;
  av.style.background = currentUser.color || '#2a1a3e';
  document.getElementById('sidebar-name').textContent = currentUser.displayName;
}

function openProfile() {
  document.getElementById('profile-av-big').textContent = currentUser.avatar;
  document.getElementById('profile-av-big').style.background = currentUser.color || '#2a1a3e';
  document.getElementById('edit-display-name').value = currentUser.displayName;
  document.getElementById('edit-bio').value = currentUser.bio || '';
  document.querySelectorAll('#profile-avatar-pick span').forEach(s =>
    s.classList.toggle('selected', s.textContent === currentUser.avatar));
  document.getElementById('profile-modal').classList.remove('hidden');
}

function pickProfileAv(el, emoji) {
  document.querySelectorAll('#profile-avatar-pick span').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('profile-av-big').textContent = emoji;
}

function saveProfile() {
  const users = DB.get('users') || {};
  const avatar = document.querySelector('#profile-avatar-pick span.selected')?.textContent || currentUser.avatar;
  users[currentUser.id] = {
    ...users[currentUser.id],
    displayName: document.getElementById('edit-display-name').value.trim() || currentUser.displayName,
    bio: document.getElementById('edit-bio').value.trim(),
    avatar
  };
  DB.set('users', users);
  currentUser = { id: currentUser.id, ...users[currentUser.id] };
  closeModal('profile-modal');
  updateSidebarUser();
  showToast('บันทึกโปรไฟล์แล้ว');
}

// ════════════════════════════════════════
// ROOMS
// ════════════════════════════════════════
function renderRoomList() {
  const rooms = DB.get('rooms') || {};
  const listEl = document.getElementById('room-list');
  listEl.innerHTML = '';
  Object.entries(rooms).forEach(([id, room]) => {
    const div = document.createElement('div');
    div.className = 'room-item' + (id === activeRoomId ? ' active' : '');
    div.onclick = () => openRoom(id);
    div.innerHTML = `<div class="room-icon">${room.icon || '💬'}</div><div class="room-name">${escapeHtml(room.name)}</div>`;
    listEl.appendChild(div);
  });
}

function openCreateRoom() {
  document.getElementById('new-room-name').value = '';
  document.getElementById('new-room-icon').value = '💬';
  document.getElementById('create-room-modal').classList.remove('hidden');
}

function createRoom() {
  const name = document.getElementById('new-room-name').value.trim();
  const icon = document.getElementById('new-room-icon').value.trim() || '💬';
  if (!name) return;
  const rooms = DB.get('rooms') || {};
  const id = 'r' + Date.now();
  rooms[id] = { name, icon, createdAt: Date.now() };
  DB.set('rooms', rooms);
  closeModal('create-room-modal');
  openRoom(id);
}

// ════════════════════════════════════════
// CHAT / MESSAGES (realtime)
// ════════════════════════════════════════
function openRoom(roomId) {
  if (activeRoomId) DB.unwatch('messages/' + activeRoomId);
  activeRoomId = roomId;
  renderRoomList();
  const rooms = DB.get('rooms') || {};
  const room = rooms[roomId];
  document.getElementById('chat-area').innerHTML = `
    <div class="chat-header">
      <div class="room-icon">${room.icon || '💬'}</div>
      <div class="chat-header-name">${escapeHtml(room.name)}</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chat-input-area">
      <textarea id="msg-input" rows="1" placeholder="พิมพ์ข้อความ..." onkeydown="handleInputKey(event)"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  `;
  DB.watch('messages/' + roomId, () => renderMessages(roomId));
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !activeRoomId) return;
  const path = 'messages/' + activeRoomId;
  const msgs = DB.get(path) || {};
  const id = 'm' + Date.now() + Math.floor(Math.random() * 1000);
  msgs[id] = { userId: currentUser.id, text, timestamp: Date.now() };
  DB.set(path, msgs);
  input.value = '';
}

function renderMessages(roomId) {
  if (roomId !== activeRoomId) return;
  const msgs = DB.get('messages/' + roomId) || {};
  const users = DB.get('users') || {};
  const sorted = Object.values(msgs).sort((a, b) => a.timestamp - b.timestamp);
  const el = document.getElementById('messages');
  if (!el) return;
  el.innerHTML = '';
  sorted.forEach(m => {
    const u = users[m.userId] || { displayName: 'ผู้ใช้', avatar: '👤', color: '#333' };
    const own = m.userId === currentUser.id;
    const group = document.createElement('div');
    group.className = 'msg-group' + (own ? ' own' : '');
    const time = new Date(m.timestamp).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    group.innerHTML = `
      <div class="msg-avatar" style="background:${u.color || '#333'}">${u.avatar}</div>
      <div class="msg-content">
        ${!own ? `<div class="msg-sender">${escapeHtml(u.displayName)}</div>` : ''}
        <div class="msg-bubble">${escapeHtml(m.text)}</div>
        <div class="msg-time">${time}</div>
      </div>`;
    el.appendChild(group);
  });
  el.scrollTop = el.scrollHeight;
}

// ════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast';
  setTimeout(() => { t.className = 'toast hidden'; t.style.display='none'; }, 2500);
  t.style.display='block';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}
</script>
